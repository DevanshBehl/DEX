
[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.24"
via_ir = true
optimizer = true
optimizer_runs = 200

remappings = [
    "@chainlink/=lib/chainlink-brownie-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
]

[invariant]
runs = 256
depth = 100
fail_on_revert = false

[profile.ci]
fuzz = { runs = 5000 }
invariant = { runs = 1000, depth = 200, fail_on_revert = false }

[rpc_endpoints]
sepolia = "${SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
